<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ライフハック！はお引っ越ししました</title>
<meta http-equiv="refresh" content="3;url=https://lifehack-br5.pages.dev/"></head>
<body style="font-family:sans-serif;text-align:center;padding:40px 20px;background:#f6f8fc;color:#234">
<h1 style="color:#1f8f82">ライフハック！はお引っ越ししました</h1><p>新しい場所はこちらです（3秒後に自動で移動します）。</p>
<p><a href="https://lifehack-br5.pages.dev/" style="display:inline-block;background:#1f8f82;color:#fff;padding:14px 24px;border-radius:12px;text-decoration:none;font-weight:bold">新しいライフハック！をひらく</a></p>
<p style="color:#888;font-size:14px">前の場所でホーム画面に追加していた場合は、そのアイコンを消して、新しい場所で追加し直してください。<br>※データは引っ越しされません。必要なら前の画面の「設定 → バックアップ」で書き出してから、新しい場所で読み込んでください。</p>
<script>
// このページ（/lifehack/）のサービスワーカーとキャッシュだけを消す（同じドメインの他のアプリには触らない）
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname.startsWith('/lifehack/'))r.unregister()}));
if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.startsWith('lifehack-')).forEach(k=>caches.delete(k)));
</script></body></html>
